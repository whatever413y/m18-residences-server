[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# SeaORM 2 turns `auto_increment()` into GENERATED BY DEFAULT AS IDENTITY on
# Postgres; this feature (sea-query's option-postgres-use-serial) keeps SERIAL so
# the schema stays identical to the baseline migration.
sea-orm = { version = "2.0.3", default-features = false, features = ["postgres-use-serial-pk"] }

[dependencies.sea-orm-migration]
version = "2.0.3"
features = [
  # Enable at least one `ASYNC_RUNTIME` and `DATABASE_DRIVER` feature if you want to run migration via CLI.
  # View the list of supported features at https://www.sea-ql.org/SeaORM/docs/install-and-config/database-and-async-runtime.
  # e.g.
  "runtime-tokio-rustls",  # `ASYNC_RUNTIME` feature (same TLS stack as the server)
  "sqlx-postgres",         # `DATABASE_DRIVER` feature
]
