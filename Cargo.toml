[package]
name = "m18-residences-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
axum-server = "0.8.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dotenvy = "0.15.7"
sea-orm = { version = "2.0.3", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
chrono = { version = "0.4.45", features = ["serde"] }
aws-sdk-s3 = { version = "1.149.0", features = ["behavior-version-latest"] }
aws-types = "1.6.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
mime_guess = "2.0.5"
# Direct dependency only to pick the process-wide crypto provider in main() (see there).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
migration = { path = "./migration" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
